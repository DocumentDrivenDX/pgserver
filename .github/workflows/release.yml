# Releases pgserver-pg16 / pgserver-pg17 / pgserver-pg18.
#
# Push a tag named pgserver-pgNN-vX.Y.Z (X.Y.Z must equal package_version in build-versions.json)
# to build, test, publish to PyPI (trusted publishing) and create a GitHub Release.
#
# workflow_dispatch builds and smoke-tests only: dry_run defaults to true and never publishes.
# The one-off "backfill" jobs at the bottom upload the EXISTING GitHub Release wheels, unchanged,
# to PyPI; they run only when backfill_tag is chosen and dry_run is false. Delete them afterwards.
name: release
on:
  push:
    tags: ['pgserver-pg1[6-8]-v*']
  workflow_dispatch:
    inputs:
      major:
        description: PostgreSQL major to build (dry run)
        type: choice
        options: ['18', '17', '16']
        default: '18'
      dry_run:
        description: Build and smoke-test only; never publish (uncheck only for a backfill)
        type: boolean
        default: true
      backfill_tag:
        description: ONE-OFF - upload this existing GitHub Release's wheels to PyPI unchanged
        type: choice
        options: ['none', 'pg16.15-pgv0.8.6-r1', 'pg17.11-pgv0.8.6-r1', 'pg18.6-pgv0.8.6-r2']
        default: 'none'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ inputs.major }}-${{ inputs.backfill_tag }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.r.outputs.build }}
      major: ${{ steps.r.outputs.major }}
      version: ${{ steps.r.outputs.version }}
      distribution: ${{ steps.r.outputs.distribution }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_MAJOR: ${{ inputs.major || '18' }}
          BACKFILL: ${{ inputs.backfill_tag || 'none' }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          config = json.load(open('build-versions.json'))
          build = 'true'
          if os.environ['REF_TYPE'] == 'tag':
              m = re.fullmatch(r'pgserver-pg(1[678])-v(\d+\.\d+\.\d+)', os.environ['REF_NAME'])
              if not m:
                  raise SystemExit('Tag must look like pgserver-pg18-v18.6.1')
              major, tag_version = m.groups()
              if config['postgres'][major]['package_version'] != tag_version:
                  raise SystemExit(f"Tag version {tag_version} != build-versions.json package_version "
                                   f"{config['postgres'][major]['package_version']}")
          else:
              major = os.environ['INPUT_MAJOR']
              if os.environ['BACKFILL'] != 'none':
                  build = 'false'
          entry = config['postgres'][major]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"build={build}\nmajor={major}\nversion={entry['package_version']}\ndistribution={entry['distribution']}\n")
          PYTHON

  wheels:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    name: wheels (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {name: linux-x64, os: ubuntu-24.04, arch: x86_64}
          - {name: linux-arm64, os: ubuntu-24.04-arm, arch: aarch64}
          # Hosted macOS arm64 runner; allowed only in this release workflow. macos-14 is rejected by
          # GitHub ("configuration macos-14-arm64-us-default is not supported"). macos-15 is the current
          # supported arm64 label; hosted macOS arm64 capacity can mean long queue times.
          - {name: macos-arm64, os: macos-15, arch: arm64}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select pinned PostgreSQL and package identity
        run: python scripts/select-postgres.py '${{ needs.resolve.outputs.major }}'
      - name: Install native build prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      # cibuildwheel builds PostgreSQL + pgvector, builds each wheel, installs it and runs the
      # product tests plus the README quickstart (cibuildwheel_test.bash) against the installed wheel.
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_ARCHS: ${{ matrix.platform.arch }}
          CIBW_BUILD: 'cp311-* cp312-* cp313-* cp314-*'
          CIBW_SKIP: '*-musllinux* *-win*'
          CIBW_BEFORE_ALL_LINUX: 'yum install -y bison flex zlib-devel && command -v patchelf && make'
          CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET=14.0'
          MACOSX_DEPLOYMENT_TARGET: '14.0'
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  smoke:
    # Gate 3: fresh venv, install the BUILT wheel (not the source tree), run the README quickstart.
    needs: [resolve, wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x64
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install built wheel in a fresh venv and run the quickstart
        run: |
          ls -l dist
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*cp312*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/.github/run_quickstart.py" "$GITHUB_WORKSPACE/README.md" \
            --expect "PostgreSQL ${{ needs.resolve.outputs.major }}."

  publish:
    # Tag pushes only. dispatch never reaches this job.
    needs: [resolve, wheels, smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Count wheels and write SHA256SUMS
        run: |
          test "$(ls dist/*.whl | wc -l)" -eq 12
          (cd dist && sha256sum *.whl > SHA256SUMS)
          mkdir ../aside && mv dist/SHA256SUMS ../aside/
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.whl
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp ../aside/SHA256SUMS dist/
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" || \
            gh release create "$TAG" dist/*.whl dist/SHA256SUMS -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  verify-pypi:
    needs: [resolve, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install from PyPI in a fresh venv and run the quickstart
        env:
          DIST: ${{ needs.resolve.outputs.distribution }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          for i in 1 2 3 4 5; do
            "$RUNNER_TEMP/venv/bin/pip" install --no-cache-dir "$DIST==$VERSION" && break
            echo "PyPI not ready yet (attempt $i)"; sleep 30
          done
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/.github/run_quickstart.py" "$GITHUB_WORKSPACE/README.md" \
            --expect "PostgreSQL ${{ needs.resolve.outputs.major }}."

  # ---- ONE-OFF: upload the existing 16.15.1 / 17.11.1 / 18.6.1 wheels to PyPI, byte for byte. ----
  # Dispatch with backfill_tag set. With dry_run (the default) only the checksums are verified.
  # Delete these two jobs once all three tags have been uploaded.
  backfill-check:
    if: github.event_name == 'workflow_dispatch' && inputs.backfill_tag != 'none'
    runs-on: ubuntu-24.04
    steps:
      - name: Download release assets and verify SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          T: ${{ inputs.backfill_tag }}
        run: |
          gh release download "$T" -R "$GITHUB_REPOSITORY" -D dist --pattern '*.whl' --pattern SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          test "$(ls dist/*.whl | wc -l)" -eq 12
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: backfill-wheels
          path: dist/*.whl
  backfill-publish:
    needs: backfill-check
    if: github.event_name == 'workflow_dispatch' && inputs.backfill_tag != 'none' && !inputs.dry_run
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backfill-wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
