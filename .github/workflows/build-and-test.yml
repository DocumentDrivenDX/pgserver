name: Build verified release wheels
on:
  push:
    branches: [main]
    tags: ['pg*-pgv*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native build prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: 'cp39-* cp310-* cp311-* cp312-* cp313-*'
          CIBW_SKIP: '*-musllinux* *-win*'
          CIBW_BEFORE_ALL_LINUX: 'yum install -y bison flex zlib-devel patchelf && make'
          CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET=14.0'
          MACOSX_DEPLOYMENT_TARGET: '14.0'
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: wheels
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag against build configuration
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('pgbuild/Makefile').read_text()
          pg = re.search(r'^POSTGRES_VERSION \?= (.+)$', text, re.M)[1]
          vector = re.search(r'^PGVECTOR_TAG \?= v(.+)$', text, re.M)[1]
          assert os.environ['GITHUB_REF_NAME'] == f'pg{pg}-pgv{vector}'
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.whl
      - name: Publish release wheels and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.whl > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.whl SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
