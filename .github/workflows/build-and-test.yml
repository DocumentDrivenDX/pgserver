name: Build verified release wheels
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish all three versioned GitHub Releases after all nine builds pass
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  wheels:
    name: PostgreSQL ${{ matrix.postgres }} / ${{ matrix.platform.name }}
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17', '18']
        platform:
          - name: linux-x64
            os: ubuntu-24.04
            arch: x86_64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            arch: aarch64
          - name: macos-arm64
            os: macos-14
            arch: arm64
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select pinned PostgreSQL and package identity
        run: python scripts/select-postgres.py '${{ matrix.postgres }}'
      - name: Install native build prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_ARCHS: ${{ matrix.platform.arch }}
          CIBW_BUILD: 'cp39-* cp310-* cp311-* cp312-* cp313-*'
          CIBW_SKIP: '*-musllinux* *-win*'
          CIBW_BEFORE_ALL_LINUX: 'yum install -y bison flex zlib-devel && command -v patchelf && make'
          CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET=14.0'
          MACOSX_DEPLOYMENT_TARGET: '14.0'
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-pg${{ matrix.postgres }}-${{ matrix.platform.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17', '18']
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Read release identity
        env:
          PG_MAJOR: ${{ matrix.postgres }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          entry = json.loads(Path('build-versions.json').read_text())['postgres'][os.environ['PG_MAJOR']]
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"RELEASE_TAG={entry['release_tag']}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-pg${{ matrix.postgres }}-*
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.whl
      - name: Publish release wheels and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.whl > SHA256SUMS
          gh release create "$RELEASE_TAG" *.whl SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
